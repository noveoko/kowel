# Install once:  pre-commit install
# Run on the whole tree:  pre-commit run --all-files
minimum_pre_commit_version: "3.0.0"
fail_fast: false
default_stages: [pre-commit]

exclude: |
  (?x)^(
      apps/focus_stacking/settings\.json
      | apps/focus_stacking/\.vscode/settings\.json
      | .*\.ipynb
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=10240"]
      - id: check-ast
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: |
          (?x)^(
              .*\.(csv|tsv|svg|kmz|zip|tif|tiff|png|jpg|jpeg|webp|gif|pdf)
              | archives/database\ of\ kowel\ crime/data/.*
          )$
      - id: fix-byte-order-marker
      - id: requirements-txt-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
        exclude: |
          (?x)^(
              .*\.(csv|tsv|svg)
              | archives/database\ of\ kowel\ crime/data/.*
          )$

  # Filename deny-list so `git add -f .env` still fails the commit.
  - repo: local
    hooks:
      - id: forbid-secret-filenames
        name: Block secret filenames
        description: Refuse .env, private keys, and credential files even if force-added.
        language: fail
        entry: "Secret-looking filename is blocked. Use .env.example and keep real secrets out of git."
        files: |
          (?x)(
              (^|/)\.env($|\.(?!example$|sample$))
              | (^|/)\.envrc$
              | (^|/)\.netrc$
              | (^|/)\.pypirc$
              | (^|/)\.streamlit/secrets\.toml$
              | (^|/)id_rsa(\.pub)?$
              | (^|/)id_dsa(\.pub)?$
              | (^|/)id_ecdsa$
              | (^|/)id_ed25519$
              | \.pem$
              | \.p12$
              | \.pfx$
              | (^|/)credentials\.json$
              | (^|/)service-account.*\.json$
              | (^|/)secrets\.(toml|ya?ml)$
          )

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: |
          (?x)^(
              .secrets\.baseline
              | .*\.(png|jpg|jpeg|gif|webp|tif|tiff|pdf|zip|kmz|blend|svg)
              | .*\.lock
              | archives/database\ of\ kowel\ crime/data/.*
          )$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
